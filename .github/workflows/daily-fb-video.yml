name: 每週智慧製造 FB + YouTube 影片自動發文

on:
  # 每週一次：台灣時間星期二 10:30（UTC 02:30）
  #
  # 2026-10-20 啟用。啟用前已完成：真實內容試跑並人工檢視
  # （run 39264001957，13.8 分鐘）、YouTube 上傳與三語字幕實測
  # （run 39260073168）、Facebook 粉專權杖驗證為永不過期。
  #
  # 注意：Anthropic 額度於 2026-11-01 才恢復，因此 10/27 那一次
  # 會在腳本生成階段失敗（不會產生也不會發布任何內容）。
  # 第一次實際發布預計為 11/03。
  schedule:
    - cron: '30 2 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '測試模式（產生影片但不上傳）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      use_fixture:
        description: '用現成腳本測試（跳過 Claude，不耗 Anthropic 額度）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      upload_test:
        description: '上傳測試（YouTube 設為不公開、跳過 Facebook）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  generate-and-post:
    name: 生成智慧製造長片並發布至 FB + YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-cjk \
           

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: scripts

      # 標題用的第二套字型。失敗不中斷：程式會自動退回黑體，
      # 只是視覺層次較弱，不值得為此讓整支影片生不出來。
      - name: Download display font
        continue-on-error: true
        run: |
          mkdir -p scripts/fonts
          curl -sfL --retry 3 --max-time 180             -o scripts/fonts/NotoSerifTC-Bold.otf             https://github.com/notofonts/noto-cjk/raw/main/Serif/SubsetOTF/TC/NotoSerifTC-Bold.otf
          ls -lh scripts/fonts/

      - name: Generate video and post to FB + YouTube
        run: python generate_video.py
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          FB_PAGE_ID:         ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN:    ${{ secrets.FB_ACCESS_TOKEN }}
          YT_CLIENT_ID:       ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:   ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:   ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN:            ${{ inputs.dry_run || 'false' }}
          FIXTURE_SCRIPT:     ${{ inputs.use_fixture == 'true' && 'fixture_script.json' || '' }}
          UPLOAD_TEST:        ${{ inputs.upload_test || 'false' }}

      - name: Upload video artifact (dry run only)
        if: ${{ inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-video
          path: |
            scripts/hsinchan_video_*.mp4
            scripts/hsinchan_video_*.srt
          retention-days: 3
