name: 每週智慧製造 FB + YouTube 影片自動發文

on:
  # 每週一次：台灣時間星期二 10:30（UTC 02:30）
  #
  # 暫時停用，待 Anthropic 額度於 2026-11-01 恢復、且人工檢視過
  # 一支完整的 dry run 之後再打開。理由：第一支公開影片不該在
  # 沒有人看過的情況下自動發布到 FB 與 YouTube。
  # 要啟用：把下面兩行的註解拿掉即可。
  # schedule:
  #   - cron: '30 2 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '測試模式（產生影片但不上傳）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      use_fixture:
        description: '用現成腳本測試（跳過 Claude，不耗 Anthropic 額度）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  generate-and-post:
    name: 生成智慧製造長片並發布至 FB + YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-cjk \
           

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: scripts

      # 標題用的第二套字型。失敗不中斷：程式會自動退回黑體，
      # 只是視覺層次較弱，不值得為此讓整支影片生不出來。
      - name: Download display font
        continue-on-error: true
        run: |
          mkdir -p scripts/fonts
          curl -sfL --retry 3 --max-time 180             -o scripts/fonts/NotoSerifTC-Bold.otf             https://github.com/notofonts/noto-cjk/raw/main/Serif/SubsetOTF/TC/NotoSerifTC-Bold.otf
          ls -lh scripts/fonts/

      - name: Generate video and post to FB + YouTube
        run: python generate_video.py
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          FB_PAGE_ID:         ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN:    ${{ secrets.FB_ACCESS_TOKEN }}
          YT_CLIENT_ID:       ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:   ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:   ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN:            ${{ inputs.dry_run || 'false' }}
          FIXTURE_SCRIPT:     ${{ inputs.use_fixture == 'true' && 'fixture_script.json' || '' }}

      - name: Upload video artifact (dry run only)
        if: ${{ inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-video
          path: |
            scripts/hsinchan_video_*.mp4
            scripts/hsinchan_video_*.srt
          retention-days: 3
