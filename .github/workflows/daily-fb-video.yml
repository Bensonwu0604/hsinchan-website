name: 每3天智慧製造 FB + YouTube 影片自動發文

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '測試模式（產生影片但不上傳）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  generate-and-post:
    name: 生成智慧製造影片並發布至 FB + YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-cjk \
           

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: scripts

      - name: Generate video and post to FB + YouTube
        run: python generate_video.py
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_ID:         ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN:    ${{ secrets.FB_ACCESS_TOKEN }}
          YT_CLIENT_ID:       ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:   ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:   ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN:            ${{ inputs.dry_run || 'false' }}

      - name: Upload video artifact (dry run only)
        if: ${{ inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-video
          path: scripts/hsinchan_video_*.mp4
          retention-days: 3
