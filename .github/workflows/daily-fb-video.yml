name: 每週智慧製造 FB + YouTube 影片自動發文

on:
  # 每週一集，週三上午 10:00（台灣時間）上線。
  #
  # 這裡在「週二」10:00 執行，產生影片後以排程方式上傳，由 YouTube
  #（publishAt）與 Facebook（scheduled_publish_time）在週三 10:00 自行發布。
  # 不直接排在週三 10:00 執行，是因為 GitHub 排程實測延遲 5.5–7.5 小時，
  # 影片會拖到下午五、六點才上線。提前一天產生，延遲再久也趕得上。
  # 官網的該集頁面由 publish-site.yml 在週三上線後才放出。
  schedule:
    - cron: '0 2 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '測試模式（產生影片但不上傳）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      use_fixture:
        description: '用現成腳本測試（跳過 Claude，不耗 Anthropic 額度）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      upload_test:
        description: '上傳測試（YouTube 設為不公開、跳過 Facebook）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      publish_now:
        description: '立即發布（不排到週三 10:00）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  generate-and-post:
    name: 生成智慧製造長片並發布至 FB + YouTube
    runs-on: ubuntu-latest
    # 發布後要把新的一集寫回 videos.json 並重建 videos.html
    permissions:
      contents: write
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-cjk \
           

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: scripts

      # 標題用的第二套字型。失敗不中斷：程式會自動退回黑體，
      # 只是視覺層次較弱，不值得為此讓整支影片生不出來。
      - name: Download display font
        continue-on-error: true
        run: |
          mkdir -p scripts/fonts
          curl -sfL --retry 3 --max-time 180             -o scripts/fonts/NotoSerifTC-Bold.otf             https://github.com/notofonts/noto-cjk/raw/main/Serif/SubsetOTF/TC/NotoSerifTC-Bold.otf
          ls -lh scripts/fonts/

      - name: Generate video and post to FB + YouTube
        run: python generate_video.py
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          # 未設定時自動略過 Azure，改試 edge-tts，再退到 OpenAI
          AZURE_SPEECH_KEY:    ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          FB_PAGE_ID:         ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN:    ${{ secrets.FB_ACCESS_TOKEN }}
          YT_CLIENT_ID:       ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:   ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:   ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN:            ${{ inputs.dry_run || 'false' }}
          FIXTURE_SCRIPT:     ${{ inputs.use_fixture == 'true' && 'fixture_script.json' || '' }}
          UPLOAD_TEST:        ${{ inputs.upload_test || 'false' }}
          PUBLISH_NOW:        ${{ inputs.publish_now || 'false' }}

      # 發布成功後把新的一集加進官網的影片頁。失敗不中斷：影片已經
      # 上線了，官網晚一步更新不該讓整個工作流程標記為失敗。
      - name: Update website video page
        if: ${{ success() && inputs.dry_run != 'true' && inputs.upload_test != 'true' }}
        continue-on-error: true
        run: |
          if [ ! -f scripts/_published.json ]; then
            echo "沒有 _published.json，略過"; exit 0
          fi
          (cd scripts && python build_videos_page.py --from-json _published.json)
          rm -f scripts/_published.json
          git add videos.json videos.html video-*.html index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "影片頁無變動"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 新增一集文章頁並更新首頁最新一集（自動）"
          CHANGED=$(git diff --name-only HEAD~1 HEAD | tr '\n' ' ')
          # 同一時段可能有其他推送（例如翻譯工作流程），先拉再推
          git pull --rebase origin main
          git push
          # 機器人推送不會觸發 indexnow.yml，這裡自己通知 Bing。
          # 等 Vercel 部署完成再提交；失敗不影響本次發布。
          python scripts/indexnow.py --files $CHANGED --wait || true

      - name: Upload video artifact (dry run only)
        if: ${{ inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-video
          path: |
            scripts/hsinchan_video_*.mp4
            scripts/hsinchan_video_*.srt
          retention-days: 3
