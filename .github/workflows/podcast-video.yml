name: 每3天智慧製造 Podcast 影片（雙主持人 10 分鐘）

on:
  schedule:
    # 每3天台灣時間 11:00 (UTC 03:00)，每月 2/5/8/11/14/17/20/23/26/29 日
    - cron: '0 3 2-30/3 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '測試模式（產生影片但不上傳）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  podcast:
    name: 生成雙主持人 Podcast 影片
    runs-on: ubuntu-latest
    timeout-minutes: 40       # TTS + 影片合成需較長時間

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-cjk \
            fonts-noto-cjk-extra

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: scripts

      - name: Generate podcast video and upload
        run: python generate_podcast.py
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          FB_PAGE_ID:        ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN:   ${{ secrets.FB_ACCESS_TOKEN }}
          YT_CLIENT_ID:      ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:  ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:  ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN:           ${{ inputs.dry_run || 'false' }}

      - name: Upload podcast artifact (dry run only)
        if: ${{ inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: podcast-preview
          path: scripts/hsinchan_podcast_*.mp4
          retention-days: 3
