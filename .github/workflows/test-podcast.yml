name: 試作 Podcast 影片（每3天自動執行）

on:
  schedule:
    - cron: '0 3 * * 2,5'
  push:
    paths:
      - 'scripts/test_podcast.py'
  workflow_dispatch:

jobs:
  test-podcast:
    name: 生成試作 Podcast 影片
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install --prefer-binary anthropic openai playwright

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Diagnostics
        run: |
          python -c "import anthropic; print('OK: anthropic', anthropic.__version__)"
          python -c "from openai import OpenAI; print('OK: openai')"
          python -c "from playwright.sync_api import sync_playwright; print('OK: playwright')"
          ffmpeg -version 2>&1 | head -1
        working-directory: scripts

      - name: Generate test podcast video
        run: python test_podcast.py
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}

      - name: Upload video for download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test-podcast-video
          path: scripts/test_podcast_*.mp4
          retention-days: 7
