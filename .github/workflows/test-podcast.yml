name: 試作 Podcast 影片（每3天自動執行）

on:
  schedule:
    - cron: '0 3 */3 * *'
  push:
    paths:
      - 'scripts/test_podcast.py'
  workflow_dispatch:

jobs:
  test-podcast:
    name: 生成試作 Podcast 影片
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install --prefer-binary anthropic gtts Pillow

      - name: Diagnostics
        run: |
          python -c "import anthropic; print('OK: anthropic', anthropic.__version__)"
          python -c "from gtts import gTTS; print('OK: gtts')"
          python -c "from PIL import Image; print('OK: Pillow')"
          ffmpeg -version 2>&1 | head -1
          fc-list | grep -i noto | head -3 || echo "No noto fonts"
        working-directory: scripts

      - name: Generate test podcast video
        run: python test_podcast.py
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload video for download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test-podcast-video
          path: scripts/test_podcast_*.mp4
          retention-days: 7
