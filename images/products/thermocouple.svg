<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="熱電偶探棒技術示意圖：感測探棒、雙金屬接點與溫度讀值">
  <defs>
    <linearGradient id="tcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2138"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="tcProbe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a87b8"/>
      <stop offset="45%" stop-color="#2B4B6B"/>
      <stop offset="100%" stop-color="#14233a"/>
    </linearGradient>
    <radialGradient id="tcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8255" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#C41E1E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C41E1E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tcGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M0 0H50V50" fill="none" stroke="#3a6493" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1000" height="500" fill="url(#tcBg)"/>
  <rect width="1000" height="500" fill="url(#tcGrid)"/>

  <!-- heat glow at hot junction -->
  <circle cx="790" cy="245" r="230" fill="url(#tcGlow)"/>

  <!-- overall length dimension -->
  <g stroke="#9a7c45" stroke-width="1.5" stroke-opacity="0.55" fill="none">
    <line x1="240" y1="395" x2="800" y2="395"/>
    <line x1="240" y1="388" x2="240" y2="402"/>
    <line x1="800" y1="388" x2="800" y2="402"/>
  </g>
  <text x="520" y="425" fill="#9a7c45" font-family="'Rajdhani','Barlow Condensed',sans-serif" font-size="20" text-anchor="middle" letter-spacing="4" opacity="0.65">SHEATH LENGTH</text>

  <!-- lead cable to connector -->
  <path d="M40 245 C 90 245, 110 215, 165 215" stroke="#1d3349" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M40 245 C 90 245, 110 215, 165 215" stroke="#3a6493" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- connector head -->
  <rect x="160" y="185" width="90" height="65" rx="8" fill="#14233a" stroke="#4a7ab5" stroke-width="2.5"/>
  <line x1="160" y1="203" x2="250" y2="203" stroke="#4a7ab5" stroke-width="1" opacity="0.4"/>
  <line x1="160" y1="232" x2="250" y2="232" stroke="#4a7ab5" stroke-width="1" opacity="0.4"/>
  <circle cx="205" cy="217" r="6" fill="#9a7c45"/>

  <!-- probe sheath -->
  <rect x="240" y="222" width="510" height="46" rx="4" fill="url(#tcProbe)" stroke="#4a7ab5" stroke-width="2"/>
  <!-- compression fitting rings -->
  <g stroke="#0d1c2e" stroke-width="2" opacity="0.5">
    <line x1="330" y1="222" x2="330" y2="268"/>
    <line x1="345" y1="222" x2="345" y2="268"/>
    <line x1="360" y1="222" x2="360" y2="268"/>
  </g>

  <!-- internal dissimilar-metal wires running to hot junction -->
  <path d="M250 236 L 770 244" stroke="#e8c887" stroke-width="3" fill="none" opacity="0.85"/>
  <path d="M250 254 L 770 248" stroke="#8fb8e8" stroke-width="3" fill="none" opacity="0.85"/>

  <!-- hot junction tip -->
  <path d="M750 222 L 800 240 L 800 252 L 750 270 Z" fill="#D63B3B" stroke="#ffb38a" stroke-width="2"/>
  <circle cx="790" cy="246" r="7" fill="#fff5e8"/>

  <!-- heat distortion waves -->
  <g stroke="#ff8255" stroke-width="2.5" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M850 170 q18 -24 36 0 q18 24 36 0"/>
    <path d="M865 245 q18 -24 36 0 q18 24 36 0"/>
    <path d="M850 320 q18 -24 36 0 q18 24 36 0"/>
  </g>

  <!-- digital temperature readout -->
  <rect x="55" y="280" width="190" height="90" rx="6" fill="#091320" stroke="#9a7c45" stroke-width="1.5" opacity="0.95"/>
  <text x="150" y="328" fill="#f0d6a0" font-family="'Rajdhani','Barlow Condensed',sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="2">1180°C</text>
  <text x="150" y="354" fill="#9a7c45" font-family="'Rajdhani','Barlow Condensed',sans-serif" font-size="15" text-anchor="middle" letter-spacing="6">TYPE K</text>

  <!-- thermocouple type series -->
  <text x="945" y="475" fill="#3a6493" font-family="'Rajdhani','Barlow Condensed',sans-serif" font-size="17" text-anchor="end" letter-spacing="4" opacity="0.5">K · J · T · E · R · S · B</text>
</svg>
